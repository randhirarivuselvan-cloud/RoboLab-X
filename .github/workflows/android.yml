name: RoboLab X Android CI

on:
  push:
    branches: [main, production-foundation]
  pull_request:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter create --platforms=android .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=ROBOLAB_API_URL=${{ vars.ROBOLAB_API_URL }}
      - run: flutter build appbundle --release --dart-define=ROBOLAB_API_URL=${{ vars.ROBOLAB_API_URL }}
