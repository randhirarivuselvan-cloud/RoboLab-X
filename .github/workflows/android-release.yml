name: RoboLab-X Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Android platform if absent
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.synapsex.robotics --project-name robolab_x .
          fi
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=ROBOLAB_API_URL=${{ vars.ROBOLAB_API_URL }} --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}
      - name: Build release AAB
        run: flutter build appbundle --release --dart-define=ROBOLAB_API_URL=${{ vars.ROBOLAB_API_URL }} --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoboLab-X-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: RoboLab-X-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
